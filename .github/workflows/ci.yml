name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Cache the fastembed ONNX models so cold-run CI doesn't re-download
      # ~400 MB on every push (bge-small + bge-reranker-base). Bumping the
      # `-v<n>` suffix busts the cache when we change models.
      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: |
            .fastembed_cache
            ~/.cache/fastembed
          key: fastembed-bge-small-v1.5+reranker-base-v2
      - run: cargo test --workspace --all-targets
