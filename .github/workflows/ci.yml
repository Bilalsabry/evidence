name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `evidence-desktop` is excluded — it pulls Tauri's WebView system
      # deps (libwebkit2gtk, …) that the default Ubuntu runner doesn't
      # have. Local devs lint it on their own machine; we'll add a
      # platform-aware desktop job once we ship signed releases.
      - run: cargo clippy --workspace --exclude evidence-desktop --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Cache the ONNX models downloaded by fastembed (under
      # `.fastembed_cache/`) and by `hf-hub` directly (under
      # `~/.cache/huggingface/`, used by the NLI cross-encoder). Bumping
      # the `-v<n>` suffix busts the cache when we change any model.
      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: |
            .fastembed_cache
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: onnx-bge-small-v1.5+reranker-base+distilbert-mnli-v3
      # Cache the pdfium-binaries shared library that `pdfium-auto`
      # downloads on first use. Avoids hitting GitHub Releases every CI run
      # — both for speed and to dodge transient 5xx / rate limits from the
      # runner network.
      - name: Cache pdfium binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/pdf2md
          key: pdfium-auto-v0.3-chromium-7690
      - run: cargo test --workspace --exclude evidence-desktop --all-targets

  test-ollama:
    name: test-ollama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p evidence-cli --features ollama-integration-tests --test ollama_integration

  # Exercises the real NLI cross-encoder path (`evidence-eval run
  # --real-nli`). Regression guard for model-loading / wiring breakage,
  # not an accuracy benchmark — see tests/real_nli_smoke.rs. Kept off the
  # default `test` job so a flaky model download can't block unrelated
  # PRs; this job owns that risk explicitly.
  test-real-nli:
    name: test-real-nli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same HF model cache as the `test` job. Bump the `-v<n>` suffix in
      # lockstep with that key when the NLI model changes.
      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: |
            .fastembed_cache
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: onnx-bge-small-v1.5+reranker-base+distilbert-mnli-v3
      - run: cargo test -p evidence-eval --features real-nli-smoke --test real_nli_smoke
