[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop"]
# `default-members` is the set Cargo builds when no `-p` or `--workspace`
# is given. `apps/desktop` is excluded because it pulls in WebView /
# system-graphics deps that don't belong in `cargo build`/`cargo test` on
# every dev machine and CI runner. Explicit opt-in via `cargo run -p
# evidence-desktop` (or `cargo tauri dev` from `apps/desktop/`).
default-members = [
    "crates/evidence-core",
    "crates/evidence-api",
    "crates/evidence-cli",
    "crates/evidence-eval",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Bilalsabry/evidence"
rust-version = "1.85"
