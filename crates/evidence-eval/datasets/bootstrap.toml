class = "contradicted"
description = "Cited span says 24 months; model says 48 months."
corpus_spans = [
    { id = 360, page = 1, text = "The primary endpoint was overall survival at 24 months." },
]
prompt_chunks = [
    { id = 360, span_range = [360, 360], text = "The primary endpoint was overall survival at 24 months." },
]
response_sentences = [
