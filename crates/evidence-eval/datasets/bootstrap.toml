# ─────────────────────────────── out_of_context ───────────────────────────────

[[example]]
name = "out_of_context_real_other_chunk"
class = "out_of_context"
description = "Cited span exists in the corpus but wasn't in the prompt — exactly the closed-loop case."
corpus_spans = [
    { id = 70, page = 1, text = "The trial enrolled 240 patients with stage III NSCLC." },
    { id = 71, page = 2, text = "Pembrolizumab was administered every 21 days." },
]
prompt_chunks = [
    # Only span 70 was shown — but the model cites span 71 too.
    { id = 60, span_range = [70, 70], text = "The trial enrolled 240 patients with stage III NSCLC." },
]
response_sentences = [
    { text = "Pembrolizumab was administered every 21 days.", cited_spans = [71] },
]

[[example]]
name = "out_of_context_adjacent_page"
class = "out_of_context"
description = "Cited span is on a page next to the prompt chunk; the model probably 'remembered' something from training instead of the prompt."
corpus_spans = [
    { id = 80, page = 7, text = "The contraindication list excludes pregnant women." },
    { id = 81, page = 8, text = "The exclusion criteria also bar prior CYP3A4 inhibitor use." },
]
prompt_chunks = [
    { id = 70, span_range = [80, 80], text = "The contraindication list excludes pregnant women." },
]
response_sentences = [
    { text = "Prior CYP3A4 inhibitor use is also excluded.", cited_spans = [81] },
]

# ───────────────────────────────── unsupported ────────────────────────────────

[[example]]
name = "unsupported_off_topic_citation"
class = "unsupported"
description = "Cited span exists and was in context, but doesn't entail the sentence (off-topic). Real NLI returns Neutral."
corpus_spans = [
    { id = 90, page = 1, text = "Site investigators submitted weekly safety reports to the sponsor." },
]
prompt_chunks = [
    { id = 80, span_range = [90, 90], text = "Site investigators submitted weekly safety reports to the sponsor." },
]
response_sentences = [
    { text = "Pembrolizumab was administered every 21 days.", cited_spans = [90] },
]

[[example]]
