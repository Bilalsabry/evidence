    { id = 350, page = 1, text = "Pembrolizumab was administered intravenously at 200 mg every 21 days." },
]
prompt_chunks = [
    { id = 350, span_range = [350, 350], text = "Pembrolizumab was administered intravenously at 200 mg every 21 days." },
]
response_sentences = [
    { text = "Pembrolizumab was administered at 400 mg every 21 days.", cited_spans = [350] },
]

[[example]]
