# Expansion set: 18 additional examples, 3 per class. Pharma /
# clinical-trial / FDA-label flavored content. Designed to also be
# tractable for a real NLI cross-encoder (the entailment classes use
# pairs that a standard MNLI model should classify consistently with the
# class label).
# ═════════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────── valid (more) ────────────────────────────

[[example]]
name = "valid_dose_titration"
class = "valid"
description = "A clinical-dosing claim cited to its source span on page 2."
corpus_spans = [
    { id = 200, page = 2, text = "Pembrolizumab was administered intravenously at 200 mg every 21 days." },
]
prompt_chunks = [
    { id = 200, span_range = [200, 200], text = "Pembrolizumab was administered intravenously at 200 mg every 21 days." },
]
response_sentences = [
    { text = "Pembrolizumab was administered intravenously at 200 mg every 21 days.", cited_spans = [200] },
]

[[example]]
name = "valid_two_spans_one_sentence"
class = "valid"
description = "A single claim that cites two supporting spans together."
corpus_spans = [
    { id = 210, page = 4, text = "The intent-to-treat population included all randomized patients." },
    { id = 211, page = 4, text = "Median follow-up was 18.4 months at the data cutoff." },
]
prompt_chunks = [
    { id = 210, span_range = [210, 210], text = "The intent-to-treat population included all randomized patients." },
    { id = 211, span_range = [211, 211], text = "Median follow-up was 18.4 months at the data cutoff." },
]
response_sentences = [
    { text = "The intent-to-treat population included all randomized patients, with median follow-up of 18.4 months.", cited_spans = [210, 211] },
]

[[example]]
