# Bootstrap eval set for the Closed-Loop Citation harness.
#
# Twelve examples, two per hallucination class. Each one is small enough
# to read and verify by hand. The runner asserts the validator's
# behavior matches the class label under every ValidationPolicy.
#
# Class taxonomy (see `evidence_eval::HallucinationClass`):
# - valid           : every gate accepts
# - uncited         : any policy that requires citations refuses
# - fabricated_span : existence gate refuses
# - out_of_context  : in-context gate refuses
# - unsupported     : support gate refuses (Neutral)
# - contradicted    : support gate refuses (Contradicts)

# ──────────────────────────────────────── valid ───────────────────────────────

[[example]]
name = "valid_single_sentence"
class = "valid"
description = "Model produces one sentence with a valid in-context citation supported by its span."
corpus_spans = [
    { id = 10, page = 1, text = "The contraindication list excludes pregnant women and patients under 18." },
]
prompt_chunks = [
    { id = 1, span_range = [10, 10], text = "The contraindication list excludes pregnant women and patients under 18." },
]
response_sentences = [
    { text = "The contraindication list excludes pregnant women and patients under 18.", cited_spans = [10] },
]

[[example]]
name = "valid_two_sentence_with_two_spans"
class = "valid"
description = "Two sentences each citing a distinct span from the prompt."
corpus_spans = [
    { id = 20, page = 1, text = "The trial enrolled 240 patients with stage III NSCLC." },
    { id = 21, page = 1, text = "The primary endpoint was overall survival at 24 months." },
]
prompt_chunks = [
    { id = 10, span_range = [20, 20], text = "The trial enrolled 240 patients with stage III NSCLC." },
    { id = 11, span_range = [21, 21], text = "The primary endpoint was overall survival at 24 months." },
]
response_sentences = [
    { text = "The trial enrolled 240 patients with stage III NSCLC.", cited_spans = [20] },
    { text = "The primary endpoint was overall survival at 24 months.", cited_spans = [21] },
]

# ────────────────────────────────── uncited ───────────────────────────────────

[[example]]
name = "uncited_confident_sentence"
