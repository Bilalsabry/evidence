# ───────────────────────────────── contradicted ───────────────────────────────

[[example]]
name = "contradicted_enrollment_number"
class = "contradicted"
description = "The canonical hallucination: cited span says 240, model says 1000."
corpus_spans = [
    { id = 110, page = 1, text = "The trial enrolled 240 patients with stage III NSCLC." },
]
prompt_chunks = [
    { id = 100, span_range = [110, 110], text = "The trial enrolled 240 patients with stage III NSCLC." },
]
response_sentences = [
    { text = "The trial enrolled 1000 patients.", cited_spans = [110] },
]

[[example]]
name = "contradicted_inclusion_inversion"
class = "contradicted"
description = "Cited span says the criterion *excludes* a population; model says it *includes* them."
corpus_spans = [
    { id = 120, page = 1, text = "The contraindication list excludes pregnant women and patients under 18." },
]
prompt_chunks = [
    { id = 110, span_range = [120, 120], text = "The contraindication list excludes pregnant women and patients under 18." },
]
response_sentences = [
    { text = "Pregnant women and patients under 18 are eligible for the trial.", cited_spans = [120] },
]

