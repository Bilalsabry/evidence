[package]
name = "evidence-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Closed-Loop Citation evaluation harness — runs labeled scenarios through each ValidationPolicy and reports the catch matrix."

[lib]
name = "evidence_eval"
path = "src/lib.rs"

[[bin]]
name = "evidence-eval"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
evidence-core = { path = "../evidence-core" }
rusqlite = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[features]
# Opt-in smoke test that exercises the real NLI cross-encoder
# (`SupportMode::RealNli`). Off by default so `cargo test` stays fast and
# offline; CI runs it on its own job with the HF model cache warmed. The
# test `#[cfg]`-gates itself on this feature.
real-nli-smoke = []

[dev-dependencies]
tempfile = "3"
