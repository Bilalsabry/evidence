[package]
name = "evidence-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core ingestion, retrieval, and citation logic for evidence."

[dependencies]
fastembed = "5"
pdfium-render = "0.8"
pdfium-auto = "0.3"
rusqlite = { version = "0.39", features = ["bundled"] }
sqlite-vec = "0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
pdf-writer = "0.14"
